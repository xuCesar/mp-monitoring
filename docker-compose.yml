services:
  signaling-server:
    build:
      context: .
      dockerfile: apps/signaling-server/Dockerfile
    env_file:
      - path: .env
        required: false
    expose:
      - "3000"

  viewer-web:
    build:
      context: .
      dockerfile: apps/viewer-web/Dockerfile
      args:
        VITE_SIGNALING_ORIGIN: ${VITE_SIGNALING_ORIGIN:-http://127.0.0.1}
        VITE_ROOM_ID: ${VITE_ROOM_ID:-camera-01}
        VITE_VIEWER_ACCESS_TOKEN: ${VITE_VIEWER_ACCESS_TOKEN:-replace-me}
        VITE_SOCKET_TRANSPORTS: ${VITE_SOCKET_TRANSPORTS:-websocket,polling}
        VITE_BASE_PATH: /
    expose:
      - "4173"

  camera-pwa:
    build:
      context: .
      dockerfile: apps/camera-pwa/Dockerfile
      args:
        VITE_SIGNALING_ORIGIN: ${VITE_SIGNALING_ORIGIN:-http://127.0.0.1}
        VITE_ROOM_ID: ${VITE_ROOM_ID:-camera-01}
        VITE_CAMERA_DEVICE_TOKEN: ${VITE_CAMERA_DEVICE_TOKEN:-replace-me}
        VITE_SOCKET_TRANSPORTS: ${VITE_SOCKET_TRANSPORTS:-websocket,polling}
        VITE_BASE_PATH: /camera/
    expose:
      - "4174"

  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # TURN_SECRET 不能写进仓库；这里通过 compose 变量注入 Coturn 长期共享密钥。
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:-replace-me}
      - --realm=${TURN_REALM:-monitor.local}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      - signaling-server
      - viewer-web
      - camera-pwa
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
